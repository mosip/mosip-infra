# Alpine with curl + ssh
apiVersion: v1
kind: Pod
metadata:
  name: busybox-curl
spec:
  containers:
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

  - name: busybox-curl
    image: yauritux/busybox-curl:latest 
    args:
    - sleep
    - "1000000"
