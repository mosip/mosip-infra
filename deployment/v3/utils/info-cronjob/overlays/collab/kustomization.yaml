apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: CronJob
      name: info
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: info
      spec:
        schedule: "0 2 * * *"
        jobTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: fetch-info
                    env:
                      - name: ENV_NAME
                        value: collab
