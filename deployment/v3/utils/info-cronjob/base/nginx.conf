# Browsers get the dashboard at /info; curl/scripts keep getting the plain-text report there.
map $http_accept $info_page {
    default       /info/info.txt;
    "~*text/html" /info/index.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    charset utf-8;

    location = /info {
        add_header Cache-Control "no-cache";
        add_header Vary Accept;
        try_files $info_page =404;
    }

    location = /info/ {
        add_header Cache-Control "no-cache";
        add_header Vary Accept;
        try_files $info_page =404;
    }

    location /info/ {
        add_header Cache-Control "no-cache";
    }

    location / {
    }
}
