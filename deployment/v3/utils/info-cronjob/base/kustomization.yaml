apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: info

resources:
  - info-cronjob.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: info-script-config
    files:
      - fetch-info.sh
  - name: info-web
    files:
      - index.html
  - name: info-nginx
    files:
      - default.conf=nginx.conf
